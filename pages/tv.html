<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BMF — Mode TV</title>
<link rel="stylesheet" href="../css/style.css"/>
<style>
  html, body { overflow: hidden; background: #000; }
  .tv-root { position: fixed; inset: 0; background: #030303; color: var(--text); font-family: var(--font-body); }
  #emberCanvasTV { position: fixed; inset: 0; z-index: 0; }
  .tv-grid { position: fixed; inset: 0; z-index: 1; background-image: linear-gradient(rgba(201,162,39,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(201,162,39,0.04) 1px, transparent 1px); background-size: 44px 44px; pointer-events: none; }
  .tv-watermark { position: fixed; right: 4vw; bottom: 2vh; width: 34vw; max-width: 480px; opacity: 0.05; z-index: 1; pointer-events: none; }
  .tv-start {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #030303; cursor: pointer;
  }
  .tv-start img { width: 120px; }
  .tv-start .go { font-family: var(--font-display); font-size: 22px; color: var(--gold-bright); letter-spacing: 0.1em; text-transform: uppercase; }
  .tv-start .sub { color: var(--text-dim); font-size: 13px; }
  .tv-stage { position: relative; z-index: 2; height: 100vh; perspective: 1800px; display: flex; align-items: center; justify-content: center; }
  .slide {
    position: absolute; inset: 60px; display: none; flex-direction: column;
    transform-style: preserve-3d; animation: flipIn .9s cubic-bezier(.22,1,.36,1);
  }
  .slide.active { display: flex; }
  @keyframes flipIn { from { transform: rotateY(90deg); opacity: 0; } to { transform: rotateY(0deg); opacity: 1; } }
  .slide-title { font-family: var(--font-display); font-size: 34px; color: var(--gold-bright); letter-spacing: 0.06em; text-align:center; margin-bottom: 30px; position: relative; }
  .slide-title.glitch { animation: glitch 5s infinite; }
  @keyframes glitch {
    0%, 96%, 100% { text-shadow: none; transform: translate(0,0); }
    97% { text-shadow: -2px 0 var(--red-bright), 2px 0 var(--gold); transform: translate(-1px, 0); }
    98% { text-shadow: 2px 0 var(--red-bright), -2px 0 var(--gold); transform: translate(1px, 0); }
  }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 26px; margin: 20px 0; }
  .podium .pillar { width: 140px; border-radius: 8px 8px 0 0; background: linear-gradient(180deg, var(--bg-3), var(--bg-1)); border: 1px solid var(--line); text-align: center; padding-top: 14px; }
  .podium .p1 { height: 210px; border-color: var(--gold); }
  .podium .p2 { height: 160px; }
  .podium .p3 { height: 120px; }
  .podium .medal { font-size: 30px; }
  .podium .pname { font-size: 14px; margin-top: 6px; }
  .podium .pgain { font-family: var(--font-mono); color: var(--gold-bright); margin-top: 4px; }
  .rank-row { display: flex; align-items: center; gap: 16px; padding: 10px 26px; font-size: 18px; }
  .rank-row .bar-wrap { flex: 1; height: 14px; background: var(--bg-2); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .rank-row .bar { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright)); transition: width 1.4s cubic-bezier(.22,1,.36,1); }
  .kpi-row { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
  .kpi { text-align: center; }
  .kpi .val { font-family: var(--font-mono); font-size: 46px; color: var(--gold-bright); }
  .kpi .lab { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; }
  .hint-bar { position: fixed; bottom: 10px; left: 0; right: 0; z-index: 5; text-align: center; font-size: 10.5px; color: rgba(255,255,255,0.25); letter-spacing: 0.08em; }
  .pause-badge { position: fixed; top: 18px; right: 24px; z-index: 5; background: rgba(201,162,39,0.12); border: 1px solid var(--gold-dim); color: var(--gold-bright); padding: 6px 14px; border-radius: 100px; font-size: 11px; display: none; }
  .progress-track { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.05); z-index: 6; }
  .progress-bar { height: 100%; background: var(--gold-bright); width: 0%; }
  .badge-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
  .badge-pill { border: 1px solid var(--line); border-radius: 100px; padding: 6px 14px; font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
<div class="tv-root">
  <canvas id="emberCanvasTV"></canvas>
  <div class="tv-grid"></div>
  <img src="../img/logo.png" class="tv-watermark" alt=""/>
  <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  <div class="pause-badge" id="pauseBadge">⏸ En pause</div>

  <div class="tv-start" id="tvStart">
    <img src="../img/logo.png" alt="BMF"/>
    <div class="go">▶ Démarrer le mode TV</div>
    <div class="sub">Active le son et le plein écran</div>
  </div>

  <div class="tv-stage" id="tvStage"></div>
  <div class="hint-bar">Espace = pause · ← → = navigation</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
let SLIDES = [], CUR = 0, PAUSED = false, TIMER = null, PROG_TIMER = null;
const DUREE = 13000;

async function boot() {
  const session = await requireSession();
  if (!session) return;

  initEmbersTV();

  document.getElementById("tvStart").addEventListener("click", async () => {
    document.getElementById("tvStart").style.display = "none";
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    jouerWhoosh();
    await chargerDonnees();
    demarrerRotation();
    demarrerBoucleSemaine();
  });

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); togglePause(); }
    if (e.key === "ArrowRight") { e.preventDefault(); allerSlide(CUR + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); allerSlide(CUR - 1); }
  });
}

function demarrerBoucleSemaine() {
  ensureSemaineAuto();
  setInterval(ensureSemaineAuto, 60000);
}

async function chargerDonnees() {
  const [membresSnap, semSnap, statsSnap] = await Promise.all([
    db.ref("membres").get(),
    db.ref("semaines").orderByChild("debut").limitToLast(1).get(),
    db.ref("stats_membres").get(),
  ]);
  const membres = membresSnap.val() || {};
  const semaines = semSnap.val() || {};
  const semId = Object.keys(semaines)[0];
  const semaine = semId ? semaines[semId] : null;
  const stats = statsSnap.val() || {};

  let actions = {};
  if (semId) {
    const actSnap = await db.ref("actions/" + semId).get();
    actions = actSnap.val() || {};
  }

  const gains = {};
  let totalActions = 0, gainsSale = 0, gainsPropre = 0;
  Object.values(actions).forEach(a => {
    if (a.resultat !== "Réussite") return;
    totalActions++;
    gainsSale += Number(a.montant_sale) || 0;
    gainsPropre += Number(a.montant_propre) || 0;
    gains[a.membre_id] = (gains[a.membre_id] || 0) + (Number(a.montant_sale) || 0) + (Number(a.montant_propre) || 0);
  });
  const classement = Object.entries(gains).sort((a, b) => b[1] - a[1]);
  const maxGain = classement.length ? classement[0][1] : 1;

  // Palmarès
  const totalActionsAllTime = Object.values(stats).reduce((s, v) => s + (v.total_actions || 0), 0);
  const streaks = Object.entries(stats).filter(([, v]) => v.streak_actuel > 0).sort((a, b) => b[1].streak_actuel - a[1].streak_actuel).slice(0, 3);
  const dernierBadges = [];
  Object.entries(stats).forEach(([id, v]) => {
    Object.entries(v.badges || {}).forEach(([bId, ts]) => dernierBadges.push({ id, bId, ts }));
  });
  dernierBadges.sort((a, b) => b.ts - a.ts);

  SLIDES = [
    slideClassement(semaine, classement, maxGain, membres),
    slideBilan(semaine, totalActions, gainsSale, gainsPropre, classement, membres),
    slidePalmares(totalActionsAllTime, streaks, membres, dernierBadges.slice(0, 6)),
  ];

  const stage = document.getElementById("tvStage");
  stage.innerHTML = SLIDES.map((s, i) => `<div class="slide ${i === 0 ? "active" : ""}" data-i="${i}">${s}</div>`).join("");
}

function slideClassement(semaine, classement, maxGain, membres) {
  const top = classement.slice(0, 8);
  return `
    <div class="slide-title glitch">🏆 Classement — ${semaine ? semaine.nom : "Semaine"}</div>
    ${top.length ? top.map(([id, gain], i) => `
      <div class="rank-row">
        <div style="width:40px; text-align:center;">${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1)}</div>
        <div style="width:220px;">${membres[id] ? membres[id].prenom + " " + membres[id].nom : "?"}</div>
        <div class="bar-wrap"><div class="bar" style="width:${Math.max(4, (gain / maxGain) * 100)}%"></div></div>
        <div class="mono text-gold" style="width:120px; text-align:right;">${fmtArgent(gain)}</div>
      </div>`).join("") : `<div class="empty-state">Aucune action cette semaine.</div>`}
  `;
}

function slideBilan(semaine, totalActions, gainsSale, gainsPropre, classement, membres) {
  const top3 = classement.slice(0, 3);
  return `
    <div class="slide-title glitch">📋 Bilan de semaine</div>
    <div class="kpi-row">
      <div class="kpi"><div class="val">${totalActions}</div><div class="lab">Actions réussies</div></div>
      <div class="kpi"><div class="val">${fmtArgent(gainsSale)}</div><div class="lab">Gains sale</div></div>
      <div class="kpi"><div class="val">${fmtArgent(gainsPropre)}</div><div class="lab">Gains propre</div></div>
    </div>
    <div class="podium">
      ${["p2","p1","p3"].map((cls, idx) => {
        const order = [1, 0, 2][idx];
        const entry = top3[order];
        if (!entry) return `<div class="pillar ${cls}"><div class="medal">—</div></div>`;
        const [id, gain] = entry;
        return `<div class="pillar ${cls}">
          <div class="medal">${order === 0 ? "🥇" : order === 1 ? "🥈" : "🥉"}</div>
          <div class="pname">${membres[id] ? membres[id].prenom : "?"}</div>
          <div class="pgain">${fmtArgent(gain)}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function slidePalmares(totalActionsAllTime, streaks, membres, derniersBadges) {
  const badgeDefsMap = Object.fromEntries(BADGES_DEFS.map(b => [b.id, b]));
  return `
    <div class="slide-title glitch">👑 Palmarès</div>
    <div class="kpi-row">
      <div class="kpi"><div class="val">${totalActionsAllTime}</div><div class="lab">Actions — tout temps</div></div>
    </div>
    <div style="margin-top:24px; text-align:center;">
      <div class="text-dim" style="text-transform:uppercase; font-size:12px; letter-spacing:.08em; margin-bottom:10px;">Séries en tête actuelles</div>
      <div class="badge-list">
        ${streaks.length ? streaks.map(([id, v]) => `<div class="badge-pill">🔥 ${membres[id] ? membres[id].prenom : "?"} — x${v.streak_actuel}</div>`).join("") : `<div class="text-dim">Aucune série en cours</div>`}
      </div>
    </div>
    <div style="margin-top:24px; text-align:center;">
      <div class="text-dim" style="text-transform:uppercase; font-size:12px; letter-spacing:.08em; margin-bottom:10px;">Derniers badges débloqués</div>
      <div class="badge-list">
        ${derniersBadges.length ? derniersBadges.map(d => `<div class="badge-pill">${badgeDefsMap[d.bId] ? badgeDefsMap[d.bId].icone : "🏅"} ${membres[d.id] ? membres[d.id].prenom : "?"} — ${badgeDefsMap[d.bId] ? badgeDefsMap[d.bId].nom : d.bId}</div>`).join("") : `<div class="text-dim">Aucun badge récent</div>`}
      </div>
    </div>
  `;
}

function allerSlide(i) {
  if (!SLIDES.length) return;
  CUR = (i + SLIDES.length) % SLIDES.length;
  document.querySelectorAll(".slide").forEach(el => el.classList.toggle("active", Number(el.dataset.i) === CUR));
  jouerWhoosh();
  resetProgress();
}

function demarrerRotation() {
  resetProgress();
  TIMER = setInterval(() => { if (!PAUSED) allerSlide(CUR + 1); }, DUREE);
}

function resetProgress() {
  clearInterval(PROG_TIMER);
  const bar = document.getElementById("progressBar");
  let start = Date.now();
  bar.style.width = "0%";
  PROG_TIMER = setInterval(() => {
    if (PAUSED) { start = Date.now() - elapsedFrozen; return; }
    const elapsed = Date.now() - start;
    bar.style.width = Math.min(100, (elapsed / DUREE) * 100) + "%";
  }, 100);
}
let elapsedFrozen = 0;

function togglePause() {
  PAUSED = !PAUSED;
  document.getElementById("pauseBadge").style.display = PAUSED ? "block" : "none";
}

function initEmbersTV() {
  const canvas = document.getElementById("emberCanvasTV");
  const ctx = canvas.getContext("2d");
  let w, h, particles;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  function spawn(n) {
    particles = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: h + Math.random() * 100,
      r: 0.6 + Math.random() * 2, vy: 0.2 + Math.random() * 0.5,
      vx: (Math.random() - 0.5) * 0.25, a: 0.1 + Math.random() * 0.4, flick: Math.random() * Math.PI * 2,
    }));
  }
  resize(); spawn(90);
  window.addEventListener("resize", resize);
  function loop() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.y -= p.vy; p.x += p.vx; p.flick += 0.04;
      const alpha = p.a * (0.6 + 0.4 * Math.sin(p.flick));
      ctx.beginPath();
      ctx.fillStyle = `rgba(201,162,39,${alpha})`;
      ctx.shadowColor = "rgba(201,162,39,0.8)"; ctx.shadowBlur = 6;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
    });
    requestAnimationFrame(loop);
  }
  loop();
}

boot();
</script>
</body>
</html>
