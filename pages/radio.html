<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BMF — Radio</title>
<link rel="stylesheet" href="../css/style.css"/>
<style>
  .radio-wrap { display: flex; flex-direction: column; align-items: center; padding: 30px 0; }
  .tuner {
    position: relative; width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #1c1c1c, #050505 70%);
    border: 1px solid var(--line); box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 30px 80px rgba(0,0,0,.7), inset 0 0 60px rgba(0,0,0,.8);
    display: flex; align-items: center; justify-content: center;
  }
  .tuner::before {
    content: ""; position: absolute; inset: 18px; border-radius: 50%; border: 1px solid var(--line);
    background: repeating-conic-gradient(from -110deg, rgba(201,162,39,0.12) 0deg 1deg, transparent 1deg 9deg);
  }
  .tuner-core {
    position: relative; z-index: 2; width: 220px; height: 220px; border-radius: 50%;
    background: linear-gradient(160deg, #161616, #050505);
    border: 1px solid var(--gold-dim); display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: inset 0 0 30px rgba(0,0,0,.9), 0 0 40px rgba(201,162,39,0.08);
  }
  .freq-value { font-family: var(--font-mono); font-size: 42px; font-weight: 600; color: var(--gold-bright); text-shadow: 0 0 18px rgba(201,162,39,0.5); letter-spacing: 0.02em; }
  .freq-unit { font-size: 11px; color: var(--text-dim); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 4px; }
  .freq-name { margin-top: 10px; font-family: var(--font-display); font-size: 13px; color: var(--text); text-align: center; padding: 0 20px; }
  .needle {
    position: absolute; top: 50%; left: 50%; width: 3px; height: 148px; background: linear-gradient(180deg, var(--red-bright), transparent 85%);
    transform-origin: top center; transform: translate(-50%, 0) rotate(0deg); z-index: 3; border-radius: 2px;
    box-shadow: 0 0 10px rgba(168,20,20,0.7);
    transition: transform 1.4s cubic-bezier(.22,1,.36,1);
  }
  .needle::after { content:""; position:absolute; top:-6px; left:50%; width:9px; height:9px; border-radius:50%; background: var(--red-bright); transform: translateX(-50%); box-shadow: 0 0 10px rgba(168,20,20,.8); }
  .eq { display: flex; align-items: flex-end; gap: 5px; height: 34px; margin-top: 26px; }
  .eq span { width: 5px; background: linear-gradient(180deg, var(--gold-bright), var(--gold-dim)); border-radius: 2px; animation: eqbar 1.1s ease-in-out infinite; }
  @keyframes eqbar { 0%,100% { height: 6px; } 50% { height: 30px; } }
  .radio-meta { margin-top: 26px; text-align: center; color: var(--text-dim); font-size: 12px; }
  .radio-meta .updated { margin-top: 4px; font-family: var(--font-mono); }
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
async function boot() {
  const session = await initShell("radio");
  if (!session) return;

  const content = document.getElementById("pageContent");
  content.innerHTML = `
    <div class="page-head"><div><h1>Radio</h1><div class="page-sub">Fréquence radio de la famille — canal sécurisé</div></div></div>
    <div class="radio-wrap">
      <div class="tuner">
        <div class="needle" id="needle"></div>
        <div class="tuner-core">
          <div class="freq-value" id="freqValue">—</div>
          <div class="freq-unit">MHz</div>
          <div class="eq">${Array.from({length:9}).map((_,i)=>`<span style="animation-delay:${(i*0.09).toFixed(2)}s"></span>`).join("")}</div>
        </div>
      </div>
      <div class="freq-name" id="freqName" style="margin-top:24px; font-size:15px;"></div>
      <div class="radio-meta">
        <div id="freqNote">La fréquence est modifiable dans Admin → Config.</div>
        <div class="updated" id="freqUpdated"></div>
      </div>
    </div>
  `;

  db.ref("config/radio").on("value", (snap) => {
    const r = snap.val() || {};
    const freq = r.frequence != null ? Number(r.frequence).toFixed(2) : "—";
    document.getElementById("freqValue").textContent = freq;
    document.getElementById("freqName").textContent = r.nom || "Canal Black Mafia Family";
    document.getElementById("freqUpdated").textContent = r.updatedAt ? "Dernière mise à jour : " + new Date(r.updatedAt).toLocaleString("fr-FR") : "";

    // aiguille positionnée selon la fréquence (échelle arbitraire 60–180 MHz -> -70°..70°)
    const f = r.frequence != null ? Number(r.frequence) : 100;
    const clamped = Math.max(60, Math.min(180, f));
    const angle = ((clamped - 60) / 120) * 140 - 70;
    document.getElementById("needle").style.transform = `translate(-50%, 0) rotate(${angle}deg)`;
  });
}
boot();
</script>
</body>
</html>
