<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BMF — Quotas</title>
<link rel="stylesheet" href="../css/style.css"/>
<style>
  .quota-row { margin-bottom: 18px; }
  .quota-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .quota-bar-wrap { height: 16px; background: var(--bg-2); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .quota-bar { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright)); transition: width .5s; }
  .quota-bar.over { background: linear-gradient(90deg, var(--red), var(--red-bright)); }
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
async function boot() {
  const session = await initShell("quotas");
  if (!session) return;

  const content = document.getElementById("pageContent");
  content.innerHTML = `
    <div class="page-head"><div><h1>Quotas</h1><div class="page-sub" id="semaineLabel">Progression de la semaine</div></div></div>
    <div class="card"><div id="quotaBody"></div></div>
  `;

  const [semSnap, catsSnap] = await Promise.all([
    db.ref("semaines").orderByChild("debut").limitToLast(1).get(),
    db.ref("quotas_categorie").get(),
  ]);
  const semaines = semSnap.val() || {};
  const semId = Object.keys(semaines)[0];
  const semaine = semId ? semaines[semId] : null;
  document.getElementById("semaineLabel").textContent = semaine ? "Semaine active : " + semaine.nom : "Aucune semaine en cours";
  const cats = catsSnap.val() || {};

  let actions = {};
  if (semId) {
    const actSnap = await db.ref("actions/" + semId).get();
    actions = actSnap.val() || {};
  }
  const mesActions = Object.values(actions).filter(a => a.membre_id === session.id && a.resultat === "Réussite");
  const totalGlobal = mesActions.filter(a => a.categorie !== "drogue").length;

  const body = document.getElementById("quotaBody");
  const lignes = [];

  lignes.push(barre("Quota global (hors drogue)", totalGlobal, session.quota_global || 0));

  Object.entries(cats).forEach(([catId, cat]) => {
    const quota = (session.quotas_categorie && session.quotas_categorie[catId]) || 0;
    if (!quota) return;
    const count = mesActions.filter(a => a.produit_id === catId).reduce((s, a) => s + (Number(a.quantite) || 1), 0);
    lignes.push(barre(cat.nom, count, quota));
  });

  body.innerHTML = lignes.join("") || `<div class="empty-state">Aucun quota configuré pour toi cette semaine.</div>`;
}

function barre(label, valeur, quota) {
  const pct = quota > 0 ? Math.min(100, Math.round((valeur / quota) * 100)) : 0;
  const over = quota > 0 && valeur >= quota;
  return `
    <div class="quota-row">
      <div class="quota-head"><span>${label}</span><span class="mono ${over ? "text-gold" : "text-dim"}">${valeur} / ${quota || "—"}</span></div>
      <div class="quota-bar-wrap"><div class="quota-bar ${over ? "over" : ""}" style="width:${quota ? pct : 0}%"></div></div>
    </div>`;
}
boot();
</script>
</body>
</html>
